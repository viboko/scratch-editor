<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Satchel demo</title>
    <style>
        /* Colours and fonts match the satchel-project site. */
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f6f0e7;
            color: #241a10;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }

        img {
            width: 240px;
            height: 240px;
        }

        h1 {
            margin: 24px 0 0;
            font-size: 72px;
            line-height: 1.1;
        }

        .subtitle {
            margin: 16px 0 0;
            color: #8a4a26;
            font-size: 36px;
        }

        .date {
            margin: 40px 0 0;
            padding-top: 24px;
            border-top: 2px solid #ddcbb0;
            color: #5a4a3c;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <img src="satchel-logo.svg" alt="">
    <h1>Satchel demo</h1>
    <p class="subtitle">Saving to a Solid Pod</p>
    <p class="date">25th October 2026</p>
</body>
</html>
