name: Sync upstream
on:
  schedule:
    - cron: '17 5 * * 1' # Mondays at 05:17 UTC
  workflow_dispatch:

concurrency:
  group: sync-upstream

jobs:
  sync:
    if: github.repository == 'viboko/scratch-editor'
    runs-on: ubuntu-latest
    steps:
      # SYNC_TOKEN is a token with Contents and Workflows write access. GITHUB_TOKEN can't push upstream's changes to
      # workflow files, and its pushes don't trigger CI.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: hooks
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Mirror upstream develop and merge it into hooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/scratchfoundation/scratch-editor.git
          git fetch upstream develop
          git push origin upstream/develop:refs/heads/develop
          if ! git merge --no-edit -m "chore: merge upstream develop into hooks" upstream/develop; then
            {
              echo "Merging upstream develop into hooks conflicts in:"
              echo
              git diff --name-only --diff-filter=U | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git push origin hooks
